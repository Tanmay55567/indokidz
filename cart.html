<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cart - IndoKidz</title>
<link rel="icon" href="assets/logo.jpeg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="brand">
      <img src="assets/logo.jpeg" alt="IndoKidz logo" style="width:40px;height:40px;" />
      <span>
        <span class="brand-name">IndoKidz</span>
        <span class="brand-tag">Ride-ons · Bicycles · Tricycles</span>
      </span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
    <div class="nav-actions">
      <a href="cart.html" class="icon-btn">🛒<span class="cart-count">0</span></a>
    </div>
  </nav>
</header>

<section class="page-head">
  <div class="wrap">
    <h1>Shopping Cart</h1>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div id="cart-empty" style="text-align:center; padding:60px 20px;">
      <h2>Your cart is empty</h2>
      <p>Browse our collection and add some amazing ride-ons!</p>
      <a href="shop.html" class="btn btn-primary">Continue Shopping</a>
    </div>
    <div id="cart-items" style="display:none;">
      <div id="cart-list"></div>
      <div style="margin-top:40px; text-align:right;">
        <h3>Total: <span id="cart-total">₹0</span></h3>
        <a href="shop.html" class="btn btn-outline">Continue Shopping</a>
        <button class="btn btn-primary" style="margin-left:10px;">Proceed to Checkout</button>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom" style="text-align:center;">
      <span>© <span class="year"></span> IndoKidz. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/site.js"></script>
</body>
</html>
