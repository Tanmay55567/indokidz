<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact - IndoKidz</title>
<link rel="icon" href="assets/logo.jpeg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="brand">
      <img src="assets/logo.jpeg" alt="IndoKidz logo" style="width:40px;height:40px;" />
      <span>
        <span class="brand-name">IndoKidz</span>
        <span class="brand-tag">Ride-ons · Bicycles · Tricycles</span>
      </span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
    <div class="nav-actions">
      <a href="cart.html" class="icon-btn">🛒<span class="cart-count">0</span></a>
    </div>
  </nav>
</header>

<section class="page-head">
  <div class="wrap">
    <h1>Contact Us</h1>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div style="max-width:600px; margin:0 auto;">
      <form style="background:#f8f9fa; padding:30px; border-radius:10px;">
        <div style="margin-bottom:20px;">
          <label>Name</label>
          <input type="text" placeholder="Your name" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:5px;" />
        </div>
        <div style="margin-bottom:20px;">
          <label>Email</label>
          <input type="email" placeholder="your@email.com" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:5px;" />
        </div>
        <div style="margin-bottom:20px;">
          <label>Message</label>
          <textarea placeholder="Your message" rows="5" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:5px;"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom" style="text-align:center;">
      <span>© <span class="year"></span> IndoKidz. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="js/site.js"></script>
</body>
</html>
